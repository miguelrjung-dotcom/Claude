<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Farmacologia Clínica — Medicina · Estudo guiado</title>
<meta name="description" content="Plataforma de estudos de Farmacologia para estudantes de Medicina: resumos, flashcards e casos clínicos.">
<meta name="theme-color" content="#0e5e63">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --surface:#ffffff; --surface-2:#efece5; --ink:#17201f; --ink-2:#4a5654; --ink-3:#7c8785; --line:#e2ded5;
  --brand:#0e5e63; --brand-ink:#ffffff; --brand-soft:#dcefeb;
  --prova:#a14a06; --prova-bg:#fdf3e1; --prova-line:#f0d39c;
  --clin:#b42318; --clin-bg:#fdecea; --clin-line:#f3c2bc;
  --ok:#157f4c; --ok-bg:#e3f4ea; --bad:#c0362c; --bad-bg:#fbe7e5; --mid:#946006; --mid-bg:#fbf1d8;
  --radius:16px; --shadow:0 1px 2px rgba(20,30,28,.05),0 6px 20px rgba(20,30,28,.06);
  --font:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --display:"Fraunces",Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1514; --surface:#161e1d; --surface-2:#1e2827; --ink:#e8eeec; --ink-2:#b3bfbc; --ink-3:#7f8b88; --line:#2a3533;
    --brand:#5cbcb1; --brand-ink:#06201e; --brand-soft:#173532;
    --prova:#f0b25a; --prova-bg:#2a1f11; --prova-line:#5a4217;
    --clin:#f2948a; --clin-bg:#2c1716; --clin-line:#5a2723;
    --ok:#62d39c; --ok-bg:#122a1f; --bad:#f2948a; --bad-bg:#2c1716; --mid:#e8c062; --mid-bg:#2a2412;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--font);-webkit-font-smoothing:antialiased;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
h1,h2,h3{margin:0;line-height:1.2}
.display{font-family:var(--display);font-weight:600;letter-spacing:-.01em}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .small{font-size:14px} .xs{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .wrapf{flex-wrap:wrap}
.stack>*+*{margin-top:12px} .stack-lg>*+*{margin-top:20px}
.hidden{display:none!important}

/* Top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:17px;text-decoration:none;color:var(--ink)}
.brand-txt{display:flex;flex-direction:column;line-height:1.1}.brand-txt small{font-family:var(--font);font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-top:2px}
.chip .role{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
.brand-mark{width:28px;height:28px;border-radius:9px;background:var(--brand);display:grid;place-items:center;color:var(--brand-ink)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:500}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .wrap{display:grid;grid-template-columns:repeat(4,1fr);height:64px;padding:0 6px}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--ink-3);font-size:11.5px;font-weight:600;position:relative}
.nav a.on{color:var(--brand)}
.nav svg{width:22px;height:22px}
.badge{position:absolute;top:8px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;display:grid;place-items:center}

/* Cards & sections */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.section-title{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700;margin:28px 0 10px}
.hero{padding:22px 0 6px}
.hero h1{font-size:30px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:24px;font-family:var(--display);font-weight:600;line-height:1.1}
.stat span{font-size:12.5px;color:var(--ink-2)}

/* Modules */
.mod{display:block;text-decoration:none;color:inherit;position:relative;overflow:hidden}
.mod::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--mc,var(--brand))}
.mod-icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--mc,var(--brand)) 14%,transparent);color:var(--mc,var(--brand));flex:none}
.mod-icon svg{width:24px;height:24px}
.mod h3{font-size:18px}
.pct{font-family:var(--display);font-weight:600;font-size:22px;color:var(--mc,var(--brand))}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--mc,var(--brand));border-radius:99px;transition:width .5s}
.minibars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.minibars .bar{height:5px;margin-top:4px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-2)}

/* Module view */
.back{display:inline-flex;align-items:center;gap:4px;text-decoration:none;color:var(--ink-2);font-weight:500;font-size:14.5px;margin:16px 0 8px}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);padding:4px;border-radius:12px;gap:4px;margin:16px 0}
.tabs button,.tabs a{border:0;background:transparent;padding:9px 6px;border-radius:9px;font-weight:600;font-size:14.5px;color:var(--ink-2);text-decoration:none;text-align:center}
.tabs .on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* Summary blocks */
.lead{font-size:17px;color:var(--ink-2)}
.classes{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:560px){.classes{grid-template-columns:1fr 1fr}}
.cls{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.cls h4{margin:0 0 4px;font-size:15.5px}
.cls .drugs{font-size:13.5px;color:var(--brand);font-weight:600}
.cls p{margin:6px 0 0;font-size:14px;color:var(--ink-2)}
.callout{border-radius:14px;padding:14px 16px;border:1px solid;display:flex;gap:12px}
.callout .ic{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800}
.callout h4{margin:0 0 3px;font-size:12.5px;text-transform:uppercase;letter-spacing:.07em}
.callout p{margin:0;font-size:15px}
.callout.prova{background:var(--prova-bg);border-color:var(--prova-line)}
.callout.prova .ic{background:var(--prova);color:var(--prova-bg)} .callout.prova h4{color:var(--prova)}
.callout.clinica{background:var(--clin-bg);border-color:var(--clin-line)}
.callout.clinica .ic{background:var(--clin);color:var(--clin-bg)} .callout.clinica h4{color:var(--clin)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{background:var(--brand-soft);color:var(--brand);border-radius:999px;padding:7px 12px;font-weight:600;font-size:14px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:13.5px}
th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line)}
th{background:var(--surface-2);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:700;min-width:120px}
/* Mobile: table becomes stacked cards */
@media(max-width:640px){
  .tbl-wrap{border:0;background:transparent;overflow:visible}
  table,thead,tbody,tr,td{display:block;min-width:0;width:100%}
  thead{display:none}
  tr{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;padding:6px 0}
  td{border:0;padding:6px 14px}
  td:first-child{font-size:15.5px;color:var(--brand);padding-top:10px}
  td[data-l]::before{content:attr(data-l);display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:700}
}

/* Buttons & forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 16px;font-weight:600;font-size:15px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn.sm{padding:7px 11px;font-size:13.5px;border-radius:10px}
.btn.danger{color:var(--bad);border-color:var(--bad-bg)}
.btn:disabled{opacity:.5;cursor:not-allowed}
label.f{display:block;font-size:13.5px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.input,textarea,select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 13px;font-size:16px;outline:none}
textarea{min-height:120px;resize:vertical;line-height:1.5}
.input:focus,textarea:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
.grid2{display:grid;grid-template-columns:1fr;gap:12px} @media(min-width:560px){.grid2{grid-template-columns:1fr 1fr}}

/* Flashcards */
.flip{perspective:1400px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.flip-inner{position:relative;min-height:320px;transition:transform .55s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.flip.on .flip-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;padding:24px;display:flex;flex-direction:column;border:1px solid var(--line);box-shadow:var(--shadow);overflow:auto}
.face.front{background:var(--surface)}
.face.back{background:var(--brand-soft);transform:rotateY(180deg)}
.face .q{font-family:var(--display);font-size:23px;font-weight:600;line-height:1.3;margin:auto 0}
.face .a{font-size:16.5px;margin:auto 0}
.face .hint{font-size:12.5px;color:var(--ink-3);text-align:center;margin-top:14px}
.rates{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.rate{border-radius:14px;border:1px solid;padding:12px 6px;font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:2px}
.rate small{font-weight:500;font-size:11.5px;opacity:.8}
.rate.errei{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.rate.quase{background:var(--mid-bg);border-color:var(--mid);color:var(--mid)}
.rate.acertei{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.counter{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink-2);margin-bottom:10px}

/* Questions */
.q-stem{font-size:16.5px;font-weight:500}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;width:100%}
.opt .lt{flex:none;width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-weight:700;font-size:13px}
.opt.locked{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-bg)} .opt.right .lt{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)} .opt.wrong .lt{background:var(--bad);color:#fff}
.opt .fb{display:block;font-size:14px;color:var(--ink-2);margin-top:6px}
.opt .fb b{color:var(--ink)}
.result{margin-top:12px;font-weight:700;padding:10px 14px;border-radius:12px}
.result.ok{background:var(--ok-bg);color:var(--ok)} .result.bad{background:var(--bad-bg);color:var(--bad)}
.lvl{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:4px 9px;border-radius:7px}
.lvl.facil{background:var(--ok-bg);color:var(--ok)} .lvl.moderado{background:var(--mid-bg);color:var(--mid)} .lvl.dificil{background:var(--bad-bg);color:var(--bad)}
.case{background:var(--surface-2);border-radius:12px;padding:14px;font-size:15px;margin-top:12px}
.case-q{font-weight:700;margin-top:12px}

/* Status track */
.track{display:flex;gap:0;margin-top:14px}
.step{flex:1;text-align:center;position:relative;font-size:12px;color:var(--ink-3);font-weight:600;padding-top:30px}
.step::before{content:"";position:absolute;top:9px;left:50%;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--surface-2);border:2px solid var(--line);z-index:1}
.step::after{content:"";position:absolute;top:18px;left:-50%;width:100%;height:2px;background:var(--line)}
.step:first-child::after{display:none}
.step.done{color:var(--ok)} .step.done::before{background:var(--ok);border-color:var(--ok)} .step.done::after{background:var(--ok)}
.step.now{color:var(--mid)} .step.now::before{background:var(--mid-bg);border-color:var(--mid);animation:pulse 1.6s infinite} .step.now::after{background:var(--ok)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--mid) 40%,transparent)}50%{box-shadow:0 0 0 6px transparent}}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px}
.status.pendente{background:var(--mid-bg);color:var(--mid)} .status.corrigida{background:var(--ok-bg);color:var(--ok)}
.feedback{border-left:4px solid var(--ok);background:var(--ok-bg);border-radius:0 12px 12px 0;padding:12px 14px;margin-top:12px}
.feedback h5{margin:0 0 4px;font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ok)}
.answer-box{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:15px;white-space:pre-wrap}
details summary{cursor:pointer;font-weight:600;color:var(--brand);font-size:14px;list-style:none}
details summary::-webkit-details-marker{display:none}
details[open] summary{margin-bottom:8px}

/* Modal & toast */
.overlay{position:fixed;inset:0;background:rgba(10,16,15,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:16px}
@media(min-width:560px){.overlay{align-items:center}}
.modal{background:var(--surface);border-radius:20px;padding:22px;width:100%;max-width:420px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14.5px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
.empty{text-align:center;padding:36px 16px;color:var(--ink-2)}
.empty .big{font-size:40px;margin-bottom:6px}
.prof-head{background:linear-gradient(135deg,var(--brand),color-mix(in srgb,var(--brand) 70%,#000));color:var(--brand-ink);border-radius:var(--radius);padding:18px;margin-top:16px}
.list-item{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.alt-row{border:1px solid var(--line);border-radius:12px;padding:12px}
.radio{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
</style>
</head>

<script>
/* =====================================================================
   Farmacologia Clínica — plataforma de estudos de Farmacologia (arquivo único)
   ---------------------------------------------------------------------
   Conteúdo-base: objeto SEED abaixo. Conteúdo que a professora adiciona
   pelo painel e todo o progresso ficam salvos no navegador (localStorage).
   Para centralizar respostas de vários alunos num só lugar, troque o
   objeto Store por um backend (ex.: Firebase/Supabase) — o resto do app
   não precisa mudar.
   ===================================================================== */

const SEED = { modules: [
{
  id:"anti-hipertensivos", title:"Anti-hipertensivos", subtitle:"Classes, mecanismos e escolhas clínicas", color:"#0e7c74", icon:"gauge",
  blocks:[
    {type:"lead", text:"Cinco classes sustentam o tratamento da HAS. Saber **onde cada uma age** explica quase todos os efeitos adversos — e é isso que a prova cobra."},
    {type:"classes", title:"Classes preferenciais (1ª linha)", items:[
      {name:"Diuréticos tiazídicos e similares", drugs:"Hidroclorotiazida · Clortalidona · Indapamida", note:"Cotransportador Na⁺/Cl⁻ do túbulo distal."},
      {name:"IECA", drugs:"Captopril · Enalapril · Ramipril", note:"Bloqueiam a ECA: ↓ angiotensina II, ↑ bradicinina."},
      {name:"BRA", drugs:"Losartana · Valsartana · Olmesartana", note:"Bloqueiam o receptor AT1. Sem acúmulo de bradicinina."},
      {name:"Bloqueadores de canal de cálcio", drugs:"DHP: anlodipino, nifedipino · Não-DHP: verapamil, diltiazem", note:"DHP = vaso; não-DHP = coração."},
      {name:"Betabloqueadores", drugs:"Atenolol · Metoprolol · Carvedilol · Propranolol", note:"1ª linha em situações específicas: pós-IAM, IC, angina, controle de FC."}
    ]},
    {type:"callout", variant:"prova", title:"Cai em prova", text:"Tosse seca com IECA = **acúmulo de bradicinina** (a ECA é a própria cininase II). Conduta: trocar por **BRA**."},
    {type:"table", title:"Tabela comparativa"},
    {type:"callout", variant:"clinica", title:"Atenção clínica", text:"**IECA e BRA são contraindicados na gestação** (fetotoxicidade: oligoidrâmnio, insuficiência renal fetal). Na gestante: **metildopa, nifedipino, hidralazina** (labetalol, onde disponível)."},
    {type:"callout", variant:"prova", title:"Cai em prova", text:"Tiazídicos: **hipo** K⁺, Na⁺ e Mg²⁺; **hiper** Ca²⁺, ácido úrico, glicemia e lipídios. Diurético de alça é o oposto no cálcio: **hipocalcemia**."},
    {type:"pills", title:"Associações preferenciais", items:["IECA/BRA + BCC","IECA/BRA + tiazídico","BCC + tiazídico","4ª droga: espironolactona"]},
    {type:"callout", variant:"clinica", title:"Atenção clínica", text:"**Nunca associar IECA + BRA** (duplo bloqueio do SRAA): mais hipercalemia e lesão renal, sem benefício cardiovascular."},
    {type:"classes", title:"Outras classes — situações especiais", items:[
      {name:"Antagonista da aldosterona", drugs:"Espironolactona", note:"4ª droga na HAS resistente. Ginecomastia e hipercalemia."},
      {name:"Agonistas α2 centrais", drugs:"Clonidina · Metildopa", note:"Clonidina: rebote na suspensão. Metildopa: gestação."},
      {name:"Bloqueadores α1", drugs:"Doxazosina · Prazosina", note:"Úteis na HPB. Hipotensão de 1ª dose."},
      {name:"Vasodilatadores diretos", drugs:"Hidralazina · Minoxidil", note:"Taquicardia reflexa e retenção hídrica: associar BB + diurético."}

/* ---------------- Conteúdo (base + adições da professora) ---------------- */
function modules(){
  return [...SEED.modules, ...S.custom.modules].map(m => {
    const a = S.custom.add[m.id] || {};
    return { ...m,
      blocks:[...(m.blocks||[]), ...(a.blocks||[])],
      table:[...(m.table||[]), ...(a.rows||[])],
      flashcards:[...(m.flashcards||[]), ...(a.flashcards||[])],
      objective:[...(m.objective||[]), ...(a.objective||[])],
      discursive:[...(m.discursive||[]), ...(a.discursive||[])] };
  });
}
const getMod = id => modules().find(m => m.id === id);
function addTo(mid, kind, item){
  if (S.custom.modules.some(m => m.id === mid)) {
    const m = S.custom.modules.find(m => m.id === mid);
    const k = kind === "rows" ? "table" : kind; (m[k] = m[k] || []).push(item);
  } else {
    const a = S.custom.add[mid] = S.custom.add[mid] || {};
    (a[kind] = a[kind] || []).push(item);
  }
  save();
}

/* ---------------- Progresso & repetição espaçada ---------------- */
function prog(m){
  const p = S.progress[m.id] || {};
  const read = p.read ? 1 : 0;
  const fc = m.flashcards.length ? m.flashcards.filter(c => (S.srs[c.id]?.interval || 0) >= 1).length / m.flashcards.length : null;
  const qTot = m.objective.length + m.discursive.length;
  const qOk = m.objective.filter(q => p.obj?.[q.id]?.correct).length
            + m.discursive.filter(q => mySubs().some(s => s.qid === q.id)).length;
  const qs = qTot ? qOk / qTot : null;
  const parts = [[read,.2],[fc,.4],[qs,.4]].filter(x => x[0] !== null);
  const w = parts.reduce((a,x) => a + x[1], 0);
  const total = w ? parts.reduce((a,x) => a + x[0]*x[1], 0) / w : 0;
  return { total, read, fc: fc ?? 0, qs: qs ?? 0 };
}
const pc = x => Math.round(x*100) + "%";
const isDue = id => { const c = S.srs[id]; return !c || c.due <= Date.now(); };
const dueCards = () => modules().flatMap(m => m.flashcards.filter(c => isDue(c.id)).map(c => ({...c, mod:m.title})));
function nextInterval(id, r){
  const c = S.srs[id] || { interval:0 };
  if (r === "errei") return 0;
  if (r === "quase") return c.interval < 1 ? 1 : Math.max(1, Math.round(c.interval*1.3));
  return c.interval < 1 ? 3 : Math.round(c.interval*2.5);
}
const ivLabel = d => d === 0 ? "agora" : d === 1 ? "1 dia" : d < 30 ? d + " dias" : Math.round(d/30) + " meses";
function rateCard(id, r){
  const c = S.srs[id] || { interval:0, reps:0, lapses:0 };
  c.interval = nextInterval(id, r);
  c.due = Date.now() + (r === "errei" ? 60000 : c.interval*DAY);
  c.reps++; if (r === "errei") c.lapses++;
  c.last = r; S.srs[id] = c; save();
}
const mySubs = () => S.submissions.filter(s => s.student === S.student);
const pendingCount = () => S.submissions.filter(s => s.status === "pendente").length;

/* ---------------- Router ---------------- */
const parse = () => (location.hash.replace(/^#\/?/, "") || "").split("/");
function render(){
  const [view, a, b] = parse();
  let html;
  if (view === "m" && getMod(a)) html = vModule(getMod(a), b || "resumo");
  else if (view === "revisar") html = vReview();
  else if (view === "respostas") html = vAnswers();
  else if (view === "prof") html = vProf();
  else html = vHome();
  $app.innerHTML = html;
  nav(view);
  const role = view === "prof" && profOpen ? "professora" : "aluno";
  document.getElementById("whoami").innerHTML = `<span class="role">${role}</span>${S.student && role === "aluno" ? " · " + esc(S.student.split(" ")[0]) : ""}`;
}
function nav(view){
  const due = dueCards().length, pend = profOpen ? pendingCount() : 0;
  const it = (href, ic, label, on, n) => `<a href="${href}" class="${on?"on":""}">${ICONS[ic]}${n?`<span class="badge">${n}</span>`:""}${label}</a>`;
  document.getElementById("nav").innerHTML =
    it("#/","home","Início", !view || view==="m") +
    it("#/revisar","cards","Revisar", view==="revisar", due) +
    it("#/respostas","inbox","Respostas", view==="respostas", mySubs().filter(s=>s.status==="corrigida" && !s.seen).length) +
    it("#/prof","shield","Professora", view==="prof", pend);
}
window.addEventListener("hashchange", () => { FS = null; render(); window.scrollTo(0,0); });

    <h1 class="display">Farmacologia Clínica</h1>
    <p class="muted" style="margin:6px 0 0">Estudo guiado por módulos: resumo, flashcards e casos clínicos.</p>
    <div class="stats">

      <a class="stat" href="#/respostas" style="text-decoration:none;color:inherit"><b>${subs.filter(s=>s.status==="pendente").length}</b><span>em correção</span></a>
      <a class="stat" href="#/respostas" style="text-decoration:none;color:inherit"><b>${subs.filter(s=>s.status==="corrigida").length}</b><span>com feedback</span></a>
    </div>
  </section>
  <h2 class="section-title">Módulos</h2>

          <span class="mod-icon">${ICONS[m.icon] || ICONS.book}</span>
          <div><h3>${esc(m.title)}</h3><div class="muted small">${esc(m.subtitle||"")}</div></div>
        </div>
        <span class="pct">${pc(p.total)}</span>
      </div>
      <div class="bar" style="margin-top:14px"><i style="width:${pc(p.total)}"></i></div>
      <div class="minibars xs muted">
        <div>Resumo<div class="bar"><i style="width:${pc(p.read)}"></i></div></div>
        <div>Flashcards<div class="bar"><i style="width:${pc(p.fc)}"></i></div></div>
        <div>Questões<div class="bar"><i style="width:${pc(p.qs)}"></i></div></div>
      </div>
    </a>`; }).join("")}
  </div>
  <p class="faint xs" style="margin:24px 0 8px;text-align:center">Seu progresso fica salvo neste dispositivo.</p>`;

function vModule(m, tab){
  const p = prog(m);
  const t = (k, l) => `<a href="#/m/${esc(m.id)}/${k}" class="${tab===k?"on":""}">${l}</a>`;
  let body = tab === "flash" ? vFlash(m) : tab === "questoes" ? vQuestions(m) : vSummary(m);
  return `
  <a class="back" href="#/">‹ Módulos</a>
  <div style="--mc:${esc(m.color||"var(--brand)")}">
    <div class="row between"><h1 class="display" style="font-size:27px">${esc(m.title)}</h1><span class="pct">${pc(p.total)}</span></div>
    <div class="bar" style="margin-top:10px"><i style="width:${pc(p.total)}"></i></div>
  </div>
  <nav class="tabs">${t("resumo","Resumo")}${t("flash","Flashcards")}${t("questoes","Questões")}</nav>
  ${body}`;
}

function vSummary(m){
  const tableHtml = () => m.table.length ? `
    <h2 class="section-title">Tabela comparativa</h2>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Fármaco</th><th>Mecanismo</th><th>Efeitos adversos</th><th>Cuidados clínicos</th></tr></thead>
      <tbody>${m.table.map(r => `<tr><td>${md(r.drug)}</td><td data-l="Mecanismo">${md(r.mech)}</td><td data-l="Efeitos adversos">${md(r.ae)}</td><td data-l="Cuidados clínicos">${md(r.care)}</td></tr>`).join("")}</tbody>
    </table></div>` : "";
  let usedTable = false;
  const html = m.blocks.map(b => {
    if (b.type === "lead") return `<p class="lead">${md(b.text)}</p>`;
    if (b.type === "classes") return `<h2 class="section-title">${esc(b.title)}</h2><div class="classes">${b.items.map(i => `<div class="cls"><h4>${esc(i.name)}</h4><div class="drugs">${esc(i.drugs)}</div>${i.note?`<p>${md(i.note)}</p>`:""}</div>`).join("")}</div>`;
    if (b.type === "callout") return `<div class="callout ${b.variant==="clinica"?"clinica":"prova"}"><span class="ic">${b.variant==="clinica"?"!":"★"}</span><div><h4>${esc(b.title || (b.variant==="clinica"?"Atenção clínica":"Cai em prova"))}</h4><p>${md(b.text)}</p></div></div>`;
    if (b.type === "pills") return `<h2 class="section-title">${esc(b.title)}</h2><div class="pills">${b.items.map(i => `<span class="pill">${esc(i)}</span>`).join("")}</div>`;
    if (b.type === "table") { usedTable = true; return tableHtml(); }
    return "";
  }).join("");
  const read = S.progress[m.id]?.read;
  return `<div class="stack">${html}${usedTable ? "" : tableHtml()}</div>
    <div style="margin:28px 0 8px">
      <button class="btn block ${read?"":"primary"}" data-act="markRead" data-id="${esc(m.id)}">${read ? "✓ Resumo estudado" : "Marcar resumo como estudado"}</button>
      <a class="btn block ghost" style="margin-top:8px" href="#/m/${esc(m.id)}/flash">Ir para os flashcards →</a>
    </div>`;
}

/* ---- Flashcards ---- */
function startSession(scope, all){
  const pool = scope === "all" ? dueCards() : getMod(scope).flashcards.filter(c => all || isDue(c.id)).map(c => ({...c}));
  FS = { scope, queue: pool.sort(() => Math.random() - .5), total: pool.length, done: 0, flipped: false, stats:{errei:0,quase:0,acertei:0} };
}
function flashUI(scopeLabel){
  if (!FS) return "";
  const c = FS.queue[0];
  if (!c) {
    const s = FS.stats;
    return `<div class="card empty"><div class="big">🎉</div><h3 class="display" style="font-size:22px">Sessão concluída</h3>
      <p class="muted">${s.acertei} acertei · ${s.quase} quase · ${s.errei} errei</p>
      <button class="btn primary" data-act="endSession">Concluir</button></div>`;
  }
  return `
  <div class="counter"><span>${c.mod ? esc(c.mod) : esc(scopeLabel)}</span><span>${FS.queue.length} restante${FS.queue.length>1?"s":""}</span></div>
  <div class="flip ${FS.flipped?"on":""}" data-act="flip" role="button" aria-label="Virar cartão">
    <div class="flip-inner">
      <div class="face front"><span class="tag">Pergunta</span><div class="q">${md(c.front)}</div><div class="hint">Toque para ver a resposta</div></div>
      <div class="face back"><span class="tag">Resposta</span><div class="a">${md(c.back)}</div><div class="hint">Como você foi?</div></div>
    </div>
  </div>
  <div class="rates ${FS.flipped?"":"hidden"}">
    <button class="rate errei" data-act="rate" data-r="errei">Errei<small>${ivLabel(nextInterval(c.id,"errei"))}</small></button>
    <button class="rate quase" data-act="rate" data-r="quase">Quase<small>${ivLabel(nextInterval(c.id,"quase"))}</small></button>
    <button class="rate acertei" data-act="rate" data-r="acertei">Acertei<small>${ivLabel(nextInterval(c.id,"acertei"))}</small></button>
  </div>`;
}
function vFlash(m){
  if (FS && FS.scope === m.id) return flashUI(m.title);
  const due = m.flashcards.filter(c => isDue(c.id)).length;
  if (!m.flashcards.length) return `<div class="card empty"><div class="big">🗂️</div><p>Ainda não há flashcards neste módulo.</p></div>`;
  return `<div class="card empty">
    <div class="big">🧠</div>
    <h3 class="display" style="font-size:22px">${due ? `${due} carta${due>1?"s":""} para revisar` : "Tudo em dia!"}</h3>
    <p class="muted small">${m.flashcards.length} cartas no módulo · repetição espaçada: o que você erra volta antes.</p>
    <div class="stack" style="max-width:300px;margin:16px auto 0">
      ${due ? `<button class="btn primary block" data-act="startFlash" data-id="${esc(m.id)}">Começar revisão</button>` : ""}
      <button class="btn block" data-act="startFlash" data-id="${esc(m.id)}" data-all="1">Estudar todas as cartas</button>
    </div></div>`;
}
function vReview(){
  if (FS && FS.scope === "all") return `<h1 class="display" style="font-size:27px;margin:20px 0 14px">Revisão do dia</h1>${flashUI("Revisão")}`;
  const due = dueCards();
  return `<h1 class="display" style="font-size:27px;margin:20px 0 14px">Revisão do dia</h1>
    <div class="card empty"><div class="big">${due.length ? "🗂️" : "✅"}</div>
      <h3 class="display" style="font-size:22px">${due.length ? `${due.length} cartas de todos os módulos` : "Nenhuma carta pendente"}</h3>
      <p class="muted small">${due.length ? "Revise um pouco todo dia — é o que fixa." : "Volte amanhã ou estude um módulo específico."}</p>
      ${due.length ? `<button class="btn primary" data-act="startFlash" data-id="all">Começar</button>` : `<a class="btn" href="#/">Ver módulos</a>`}
    </div>`;
}

/* ---- Questões ---- */
function vQuestions(m){
  const t = (k,l,n) => `<button class="${qTab===k?"on":""}" data-act="qTab" data-k="${k}">${l} <span class="faint">(${n})</span></button>`;
  return `<nav class="tabs" style="margin-top:0">${t("obj","Objetivas",m.objective.length)}${t("disc","Casos clínicos",m.discursive.length)}</nav>
    <div class="stack-lg">${qTab === "obj" ? (m.objective.map((q,i) => vObj(m,q,i)).join("") || emptyQ()) : (m.discursive.map(q => vDisc(m,q)).join("") || emptyQ())}</div>`;
}
const emptyQ = () => `<div class="card empty"><div class="big">📝</div><p>Nenhuma questão ainda.</p></div>`;
function vObj(m, q, i){
  const ans = S.progress[m.id]?.obj?.[q.id];
  return `<article class="card">
    <div class="row between" style="margin-bottom:8px"><span class="tag">Questão ${i+1}</span>${ans?`<button class="btn sm ghost" data-act="redo" data-m="${esc(m.id)}" data-q="${esc(q.id)}">Refazer</button>`:""}</div>
    <div class="q-stem">${md(q.stem)}</div>
    <div class="opts">${q.options.map((o,k) => {
      let cls = "";
      if (ans) cls = k === q.correct ? "right" : (k === ans.chosen ? "wrong" : "");
      return `<button class="opt ${ans?"locked":""} ${cls}" ${ans?"disabled":""} data-act="answer" data-m="${esc(m.id)}" data-q="${esc(q.id)}" data-k="${k}">
        <span class="lt">${LETTERS[k]}</span><span>${md(o.text)}${ans && o.fb ? `<span class="fb"><b>${k===q.correct?"Correta. ":"Incorreta. "}</b>${md(o.fb)}</span>` : ""}</span></button>`;
    }).join("")}</div>
    ${ans ? `<div class="result ${ans.correct?"ok":"bad"}">${ans.correct ? "✓ Você acertou!" : "✗ Resposta correta: " + LETTERS[q.correct]}</div>` : ""}
  </article>`;
}
function track(s){
  const done = s.status === "corrigida";
  return `<div class="track">
    <div class="step done">Enviada</div>
    <div class="step ${done?"done":"now"}">Em avaliação<br>pela professora</div>
    <div class="step ${done?"done":""}">Feedback<br>disponível</div>
  </div>`;
}
function vDisc(m, q){
  const subs = mySubs().filter(s => s.qid === q.id).sort((a,b) => b.ts - a.ts);
  const last = subs[0];
  const dk = "d_" + q.id;
  return `<article class="card">
    <div class="row between"><span class="lvl ${esc(q.level)}">${LEVELS[q.level] || esc(q.level)}</span><span class="faint xs">Caso clínico</span></div>
    <div class="case">${md(q.case)}</div>
    <div class="case-q">${md(q.question)}</div>
    ${last ? `
      <div style="margin-top:14px"><span class="status ${last.status}">${last.status==="corrigida"?"✓ Corrigida":"⏳ Enviada para avaliação da professora"}</span>
      <span class="faint xs" style="margin-left:6px">${fmtDate(last.ts)}</span></div>
      ${track(last)}
      <details style="margin-top:12px"><summary>Ver minha resposta</summary><div class="answer-box">${esc(last.answer)}</div></details>
      ${last.feedback ? `<div class="feedback"><h5>Feedback da professora</h5>${md(last.feedback)}</div>` : ""}
      <details style="margin-top:12px"><summary>Enviar nova resposta</summary>${discForm(m,q,dk)}</details>`
    : discForm(m,q,dk)}
  </article>`;
}
const discForm = (m,q,dk) => `<div style="margin-top:12px">
  <label class="f" for="${dk}">Sua resposta</label>
  <textarea id="${dk}" data-draft="${dk}" placeholder="Explique seu raciocínio clínico com suas palavras…">${esc(drafts[dk]||"")}</textarea>
  <button class="btn primary block" style="margin-top:10px" data-act="submitDisc" data-m="${esc(m.id)}" data-q="${esc(q.id)}">Enviar resposta para correção</button></div>`;

/* ---- Minhas respostas ---- */
function vAnswers(){
  if (!S.student) return `<h1 class="display" style="font-size:27px;margin:20px 0 14px">Minhas respostas</h1>
    <div class="card empty"><div class="big">👤</div><p>Identifique-se para ver suas respostas.</p><button class="btn primary" data-act="askName">Informar meu nome</button></div>`;
  const subs = mySubs().sort((a,b) => b.ts - a.ts);
  subs.forEach(s => { if (s.status === "corrigida") s.seen = true; }); save();
  return `<h1 class="display" style="font-size:27px;margin:20px 0 14px">Minhas respostas</h1>
  <div class="stack">${subs.length ? subs.map(s => `
    <article class="card">
      <div class="row between wrapf"><span class="tag">${esc(s.modTitle)}</span><span class="status ${s.status}">${s.status==="corrigida"?"✓ Corrigida":"⏳ Em avaliação"}</span></div>
      <p class="small muted" style="margin:10px 0 6px">${md(s.question)}</p>
      <div class="answer-box">${esc(s.answer)}</div>
      ${track(s)}
      ${s.feedback ? `<div class="feedback"><h5>Feedback da professora · ${fmtDate(s.feedbackTs)}</h5>${md(s.feedback)}</div>` : ""}
      <p class="faint xs" style="margin:10px 0 0">Enviada em ${fmtDate(s.ts)}</p>
    </article>`).join("") : `<div class="card empty"><div class="big">📭</div><p>Você ainda não enviou respostas discursivas.</p><a class="btn" href="#/">Ir aos casos clínicos</a></div>`}
  </div>`;
}

/* ---- Área da professora ---- */
function vProf(){
  if (!profOpen) return `
    <div class="prof-head"><h1 class="display" style="font-size:24px">Área da Professora</h1><p style="margin:4px 0 0;opacity:.85" class="small">Gestão de conteúdo e correção das respostas.</p></div>
    <form class="card" style="margin-top:16px" data-form="pin">
      <label class="f" for="pin">PIN de acesso</label>
      <input class="input" id="pin" name="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="••••">
      <button class="btn primary block" style="margin-top:12px">Entrar</button>
      <p class="faint xs" style="margin:10px 0 0">PIN inicial: 1234 — troque em Ajustes.</p>
    </form>`;
  const t = (k,l) => `<button class="${profTab===k?"on":""}" data-act="profTab" data-k="${k}">${l}</button>`;
  const body = profTab === "add" ? pAdd() : profTab === "conteudo" ? pContent() : profTab === "ajustes" ? pSettings() : pSubs();
  return `<div class="prof-head row between"><div><h1 class="display" style="font-size:22px">Área da Professora</h1><p style="margin:2px 0 0;opacity:.85" class="small">${pendingCount()} resposta(s) aguardando correção</p></div>
    <button class="btn sm" data-act="logoutProf">Sair</button></div>
    <nav class="tabs">${t("respostas","Respostas")}${t("add","Adicionar")}${t("conteudo","Conteúdo")}${t("ajustes","Ajustes")}</nav>${body}`;
}
function pSubs(){
  const f = (k,l) => `<button class="btn sm ${subFilter===k?"primary":""}" data-act="subFilter" data-k="${k}">${l}</button>`;
  const list = S.submissions.filter(s => subFilter === "todas" || s.status === subFilter).sort((a,b) => b.ts - a.ts);
  return `<div class="row wrapf" style="margin-bottom:14px">${f("pendente","Pendentes ("+pendingCount()+")")}${f("corrigida","Corrigidas")}${f("todas","Todas")}</div>
  <div class="stack">${list.length ? list.map(s => { const dk = "fb_" + s.id; return `
    <article class="card">
      <div class="row between wrapf"><strong>${esc(s.student)}</strong><span class="status ${s.status}">${s.status==="corrigida"?"✓ Corrigida":"⏳ Pendente"}</span></div>
      <div class="row wrapf xs faint" style="margin-top:4px"><span>${esc(s.modTitle)}</span>·<span class="lvl ${esc(s.level)}" style="font-size:10.5px">${LEVELS[s.level]||""}</span>·<span>${fmtDate(s.ts)}</span></div>
      <details style="margin-top:10px"><summary>Ver caso clínico</summary><div class="case" style="margin-top:0">${md(s.case)}</div><p class="small"><b>${md(s.question)}</b></p></details>
      <label class="f" style="margin-top:12px">Resposta do aluno</label>
      <div class="answer-box">${esc(s.answer)}</div>
      ${s.key ? `<details style="margin-top:10px"><summary>Gabarito / pontos esperados</summary><div class="answer-box">${md(s.key)}</div></details>` : ""}
      <label class="f" for="${dk}" style="margin-top:12px">Feedback para o aluno</label>
      <textarea id="${dk}" data-draft="${dk}" placeholder="Corrija o raciocínio clínico, aponte acertos e lacunas…">${esc(drafts[dk] ?? s.feedback ?? "")}</textarea>
      <button class="btn primary block" style="margin-top:10px" data-act="saveFb" data-id="${esc(s.id)}">${s.status==="corrigida"?"Atualizar feedback":"Salvar feedback"}</button>
    </article>`; }).join("") : `<div class="card empty"><div class="big">📬</div><p>${subFilter==="pendente"?"Nenhuma resposta pendente.":"Nada por aqui ainda."}</p></div>`}
  </div>`;
}
function pAdd(){
  const mods = modules();
  if (!addModule || !mods.some(m => m.id === addModule)) addModule = mods[0]?.id;
  const types = {objective:"Questão objetiva", discursive:"Caso clínico (discursiva)", flashcard:"Flashcard", callout:"Destaque no resumo", row:"Linha da tabela comparativa", module:"Novo módulo"};
  const modSel = addType === "module" ? "" : `<div><label class="f">Módulo</label><select data-act-change="addModule">${mods.map(m => `<option value="${esc(m.id)}" ${m.id===addModule?"selected":""}>${esc(m.title)}</option>`).join("")}</select></div>`;
  let f = "";
  if (addType === "module") f = `
    <div><label class="f">Título</label><input class="input" name="title" required placeholder="Ex.: Antiarrítmicos"></div>
    <div><label class="f">Subtítulo</label><input class="input" name="subtitle" placeholder="Ex.: Classificação de Vaughan-Williams"></div>
    <div><label class="f">Texto de abertura do resumo</label><textarea name="lead" placeholder="Ideia central do módulo. Use **negrito** para destacar."></textarea></div>
    <div><label class="f">Cor</label><div class="row wrapf">${COLORS.map((c,i) => `<label class="radio"><input type="radio" name="color" value="${c}" ${i===2?"checked":""}><span style="width:22px;height:22px;border-radius:7px;background:${c};display:inline-block"></span></label>`).join("")}</div></div>`;
  if (addType === "objective") f = `
    <div><label class="f">Enunciado</label><textarea name="stem" required placeholder="Caso ou pergunta…"></textarea></div>
    ${[0,1,2,3,4].map(k => `<div class="alt-row">
      <div class="row between" style="margin-bottom:6px"><strong>Alternativa ${LETTERS[k]}</strong><label class="radio"><input type="radio" name="correct" value="${k}" ${k===0?"checked":""}> Correta</label></div>
      <input class="input" name="opt${k}" placeholder="${k<2?"Texto da alternativa":"Texto da alternativa (opcional)"}" ${k<2?"required":""}>
      <textarea name="fb${k}" style="min-height:64px;margin-top:8px" placeholder="Feedback: por que está certa ou errada"></textarea></div>`).join("")}`;
  if (addType === "discursive") f = `
    <div><label class="f">Nível</label><select name="level"><option value="facil">Fácil</option><option value="moderado">Moderado</option><option value="dificil">Difícil</option></select></div>
    <div><label class="f">Caso clínico</label><textarea name="case" required></textarea></div>
    <div><label class="f">Pergunta</label><textarea name="question" required style="min-height:70px"></textarea></div>
    <div><label class="f">Gabarito / pontos esperados <span class="faint">(só você vê)</span></label><textarea name="key"></textarea></div>`;
  if (addType === "flashcard") f = `
    <div><label class="f">Frente (pergunta)</label><textarea name="front" required style="min-height:70px"></textarea></div>
    <div><label class="f">Verso (resposta)</label><textarea name="back" required></textarea></div>`;
  if (addType === "callout") f = `
    <div><label class="f">Tipo</label><select name="variant"><option value="prova">★ Cai em prova</option><option value="clinica">! Atenção clínica</option></select></div>
    <div><label class="f">Texto</label><textarea name="text" required placeholder="Use **negrito** para destacar."></textarea></div>`;
  if (addType === "row") f = `
    <div><label class="f">Fármaco</label><input class="input" name="drug" required></div>
    <div><label class="f">Mecanismo</label><textarea name="mech" required style="min-height:70px"></textarea></div>
    <div><label class="f">Efeitos adversos</label><textarea name="ae" required style="min-height:70px"></textarea></div>
    <div><label class="f">Cuidados clínicos</label><textarea name="care" required style="min-height:70px"></textarea></div>`;
  return `<form class="card stack" data-form="add">
    <div class="grid2"><div><label class="f">Tipo de conteúdo</label><select data-act-change="addType">${Object.entries(types).map(([k,v]) => `<option value="${k}" ${k===addType?"selected":""}>${v}</option>`).join("")}</select></div>${modSel}</div>
    ${f}
    <button class="btn primary block">Adicionar</button>
    <p class="faint xs" style="margin:0">Dica: **texto** vira negrito.</p>
  </form>`;
}
function pContent(){
  const rows = [];
  const label = {flashcards:"Flashcard", objective:"Objetiva", discursive:"Caso clínico", blocks:"Destaque", rows:"Tabela", table:"Tabela"};
  const txt = (k, it) => it.front || it.stem || it.case || it.text || it.drug || "";
  S.custom.modules.forEach(m => rows.push(`<div class="list-item"><div><span class="tag">Módulo</span> <strong>${esc(m.title)}</strong></div><button class="btn sm danger" data-act="delMod" data-id="${esc(m.id)}">Excluir</button></div>`));
  modules().forEach(m => {
    const src = S.custom.modules.find(c => c.id === m.id) || S.custom.add[m.id] || {};
    ["objective","discursive","flashcards","blocks","rows","table"].forEach(k => (src[k]||[]).forEach(it => {
      if (k === "blocks" && it.type === "lead") return;
      rows.push(`<div class="list-item"><div class="small"><span class="tag">${label[k]}</span> <span class="faint">${esc(m.title)}</span><br>${esc(txt(k,it).slice(0,110))}</div><button class="btn sm danger" data-act="delItem" data-m="${esc(m.id)}" data-k="${k}" data-id="${esc(it.id)}">Excluir</button></div>`);
    }));
  });
  return `<div class="card"><h3 style="font-size:17px;margin-bottom:6px">Conteúdo adicionado por você</h3>
    <p class="muted small" style="margin:0 0 8px">O conteúdo-base do app não aparece aqui e não pode ser excluído pelo painel.</p>
    ${rows.join("") || `<p class="faint small">Nada adicionado ainda.</p>`}</div>`;
}
function pSettings(){
  return `<div class="stack">
    <form class="card stack" data-form="newpin"><h3 style="font-size:17px">Trocar PIN</h3>
      <input class="input" name="pin" type="password" inputmode="numeric" minlength="4" required placeholder="Novo PIN (mín. 4 dígitos)">
      <button class="btn block">Salvar PIN</button></form>
    <div class="card stack"><h3 style="font-size:17px">Backup</h3>
      <p class="muted small" style="margin:0">Exporte seu conteúdo e as respostas para guardar ou levar a outro dispositivo.</p>
      <button class="btn block" data-act="export">Exportar backup (.json)</button>
      <label class="btn block">Importar backup<input type="file" accept="application/json" id="importFile" hidden></label></div>
    <div class="card stack"><h3 style="font-size:17px">Onde os dados ficam</h3>
      <p class="muted small" style="margin:0">Nesta versão piloto, tudo é salvo <b>no navegador deste dispositivo</b>. Respostas enviadas pelo celular de um aluno não chegam automaticamente ao seu. Para isso, é preciso ligar o app a um banco de dados online.</p></div>
    <div class="card stack"><h3 style="font-size:17px">Zona de cuidado</h3>
      <button class="btn block danger" data-act="resetContent">Apagar conteúdo adicionado por mim</button></div>
  </div>`;
}

/* ---------------- Modal & toast ---------------- */
function modal(html){
  const o = document.createElement("div"); o.className = "overlay"; o.innerHTML = `<div class="modal">${html}</div>`;
  o.addEventListener("click", e => { if (e.target === o) o.remove(); });
  document.body.appendChild(o); o.querySelector("input,textarea")?.focus(); return o;
}
let toastT;
function toast(msg){
  document.querySelector(".toast")?.remove(); clearTimeout(toastT);
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
  toastT = setTimeout(() => t.remove(), 2600);
}
function askName(then){
  const o = modal(`<form data-form="name"><h3 class="display" style="font-size:21px">Como você se chama?</h3>
    <p class="muted small">Seu nome identifica suas respostas para a professora.</p>
    <input class="input" name="name" required maxlength="60" value="${esc(S.student||"")}" placeholder="Nome e sobrenome">
    <button class="btn primary block" style="margin-top:12px">Salvar</button></form>`);
  o.querySelector("form").addEventListener("submit", e => {
    e.preventDefault(); const v = new FormData(e.target).get("name").trim();
    if (!v) return; S.student = v; save(); o.remove(); render(); if (typeof then === "function") then();
  });
}

/* ---------------- Ações ---------------- */
const ACT = {
  askName: () => askName(),
  markRead: el => { const p = S.progress[el.dataset.id] = S.progress[el.dataset.id] || {}; p.read = !p.read; save(); render(); if (p.read) toast("Resumo marcado como estudado ✓"); },
  startFlash: el => { startSession(el.dataset.id, !!el.dataset.all); render(); },
  flip: () => { FS.flipped = !FS.flipped; document.querySelector(".flip").classList.toggle("on", FS.flipped); document.querySelector(".rates").classList.toggle("hidden", !FS.flipped); },
  rate: el => {
    const r = el.dataset.r, c = FS.queue.shift();
    rateCard(c.id, r); FS.stats[r]++;
    if (r === "errei") FS.queue.push(c);
    FS.flipped = false; render();
  },
  endSession: () => { FS = null; render(); },
  qTab: el => { qTab = el.dataset.k; render(); },
  answer: el => {
    const m = getMod(el.dataset.m), q = m.objective.find(x => x.id === el.dataset.q), k = +el.dataset.k;
    const p = S.progress[m.id] = S.progress[m.id] || {}; p.obj = p.obj || {};
    p.obj[q.id] = { chosen:k, correct: k === q.correct, ts: Date.now() }; save(); render();
  },
  redo: el => { delete S.progress[el.dataset.m].obj[el.dataset.q]; save(); render(); },
  submitDisc: el => {
    const dk = "d_" + el.dataset.q, text = (drafts[dk] || "").trim();
    if (text.length < 10) return toast("Escreva sua resposta antes de enviar.");
    const go = () => {
      const m = getMod(el.dataset.m), q = m.discursive.find(x => x.id === el.dataset.q);
      S.submissions.push({ id:uid(), student:S.student, mid:m.id, modTitle:m.title, qid:q.id, level:q.level, case:q.case, question:q.question, key:q.key||"", answer:text, ts:Date.now(), status:"pendente", feedback:"" });
      delete drafts[dk]; save(); render(); toast("Resposta enviada para avaliação da professora ✓");
    };
    S.student ? go() : askName(go);
  },
  profTab: el => { profTab = el.dataset.k; render(); },
  subFilter: el => { subFilter = el.dataset.k; render(); },
  saveFb: el => {
    const s = S.submissions.find(x => x.id === el.dataset.id), dk = "fb_" + s.id;
    const v = (drafts[dk] ?? s.feedback ?? "").trim();
    if (!v) return toast("Escreva o feedback antes de salvar.");
    s.feedback = v; s.status = "corrigida"; s.feedbackTs = Date.now(); s.seen = false; delete drafts[dk]; save(); render(); toast("Feedback salvo ✓");
  },
  logoutProf: () => { profOpen = false; render(); },
  delMod: el => { if (!confirm("Excluir este módulo e todo o conteúdo dele?")) return; S.custom.modules = S.custom.modules.filter(m => m.id !== el.dataset.id); delete S.custom.add[el.dataset.id]; save(); render(); },
  delItem: el => {
    const src = S.custom.modules.find(c => c.id === el.dataset.m) || S.custom.add[el.dataset.m];
    src[el.dataset.k] = (src[el.dataset.k]||[]).filter(i => i.id !== el.dataset.id); save(); render(); toast("Excluído");
  },
  export: () => {
    const blob = new Blob([JSON.stringify({ app:"farmacomed", v:1, exported:new Date().toISOString(), custom:S.custom, submissions:S.submissions }, null, 2)], {type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "farmacomed-backup-" + new Date().toISOString().slice(0,10) + ".json"; a.click(); URL.revokeObjectURL(a.href);
  },
  resetContent: () => { if (!confirm("Apagar todo o conteúdo que você adicionou? As respostas dos alunos são mantidas.")) return; S.custom = { modules:[], add:{} }; save(); render(); toast("Conteúdo adicionado apagado"); }
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || !ACT[el.dataset.act]) return;
  e.preventDefault(); ACT[el.dataset.act](el, e);
});
document.addEventListener("input", e => { const k = e.target.dataset?.draft; if (k) drafts[k] = e.target.value; });
document.addEventListener("change", e => {
  const a = e.target.dataset?.actChange;
  if (a === "addType") { addType = e.target.value; render(); }
  if (a === "addModule") { addModule = e.target.value; }
  if (e.target.id === "importFile" && e.target.files[0]) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result); if (d.app !== "farmacomed") throw 0;
        S.custom = Object.assign({ modules:[], add:{} }, d.custom);
        const ids = new Set(S.submissions.map(s => s.id));
        (d.submissions||[]).forEach(s => { if (!ids.has(s.id)) S.submissions.push(s); });
        save(); render(); toast("Backup importado ✓");
      } catch(err){ toast("Arquivo inválido."); }
    };
    r.readAsText(e.target.files[0]);
  }
});
document.addEventListener("submit", e => {
  const f = e.target.dataset?.form; if (!f || f === "name") return;
  e.preventDefault(); const d = Object.fromEntries(new FormData(e.target)); const t = s => (s||"").trim();
  if (f === "pin") { if (d.pin === S.pin) { profOpen = true; render(); } else toast("PIN incorreto."); return; }
  if (f === "newpin") { if (t(d.pin).length < 4) return toast("Use pelo menos 4 dígitos."); S.pin = t(d.pin); save(); e.target.reset(); toast("PIN atualizado ✓"); return; }
  if (f === "add") {
    const id = uid();
    if (addType === "module") {
      S.custom.modules.push({ id, title:t(d.title), subtitle:t(d.subtitle), color:d.color||COLORS[2], icon:"book", custom:true,
        blocks: t(d.lead) ? [{ type:"lead", text:t(d.lead), id:uid() }] : [], table:[], flashcards:[], objective:[], discursive:[] });
      save(); addModule = id; addType = "objective"; toast("Módulo criado ✓ — agora adicione conteúdo a ele"); render(); return;
    }
    if (addType === "objective") {
      const options = [], map = [];
      for (let k = 0; k < 5; k++) if (t(d["opt"+k])) { map[k] = options.length; options.push({ text:t(d["opt"+k]), fb:t(d["fb"+k]) }); }
      if (options.length < 2) return toast("Preencha ao menos 2 alternativas.");
      if (map[+d.correct] === undefined) return toast("A alternativa marcada como correta está vazia.");
      addTo(addModule, "objective", { id, stem:t(d.stem), options, correct:map[+d.correct] });
    }
    if (addType === "discursive") addTo(addModule, "discursive", { id, level:d.level, case:t(d.case), question:t(d.question), key:t(d.key) });
    if (addType === "flashcard") addTo(addModule, "flashcards", { id, front:t(d.front), back:t(d.back) });
    if (addType === "callout") addTo(addModule, "blocks", { id, type:"callout", variant:d.variant, title:d.variant==="clinica"?"Atenção clínica":"Cai em prova", text:t(d.text) });
    if (addType === "row") addTo(addModule, "rows", { id, drug:t(d.drug), mech:t(d.mech), ae:t(d.ae), care:t(d.care) });
    e.target.reset(); toast("Adicionado ao módulo ✓"); render();
  }
});

render();
</script>
</body>
</html>
